<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulaire étudiant</title>

    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
}

.container {
    width: 400px;
    margin: 80px auto;
    padding: 30px;

    background-color: white;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
}

h2 {
    text-align: center;
    margin-bottom: 30px;
}

.champ {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;

    border: 1px solid #ccc;
    border-radius: 5px;

    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #333;
}

button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 5px;

    background-color: #333;
    color: white;

    font-size: 16px;

    cursor: pointer;
}

button:hover {
    background-color: #555;
}

#resultat {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
}
    </style>

    <script src="formulaire.js" defer></script>
</head>

<body>

    <div class="container">

        <h2>Formulaire étudiant</h2>

        <form id="formulaire">

            <div class="champ">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" placeholder="Entrez votre nom" required>
            </div>

            <div class="champ">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" placeholder="Entrez votre prénom" required>
            </div>

            <div class="champ">
                <label for="email">Email :</label>
                <input type="email" id="email" placeholder="Entrez votre email" required>
            </div>

            <button type="submit">
                Enregistrer
            </button>

        </form>

        <p id="resultat"></p>

    </div>

</body>

</html>
