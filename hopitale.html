<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire étudiant</title>
    <script src="formulaire.js" defer></script>
</head>
<body>

    <h2>Formulaire étudiant</h2>

    <form id="formulaire">

        <label>Nom :</label>
        <input type="text" id="nom">
        <br><br>

        <label>Prénom :</label>
        <input type="text" id="prenom">
        <br><br>

        <label>Email :</label>
        <input type="email" id="email">
        <br><br>

        <button type="submit" >Enregistrer</button>

    </form>

    <h3>Informations enregistrées :</h3>

    <p id="resultat"></p>

   

</body>
</html>
